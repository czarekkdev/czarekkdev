<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Build · Encrypt · Secure</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9c"/><stop offset=".5" stop-color="#d4af62"/><stop offset="1" stop-color="#8f6f2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af62" stop-opacity="0"/><stop offset=".5" stop-color="#d4af62"/><stop offset="1" stop-color="#d4af62" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
      .run{animation:run 3.5s ease-in-out infinite}
      @keyframes run{0%{transform:translateX(-200px)}60%,100%{transform:translateX(380px)}}
      .bar{animation:bar 2.2s ease-in-out infinite alternate}
      @keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
      .blink{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .rot{animation:rot 9s linear infinite}
      @keyframes rot{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#080706"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#d4af62" stroke-opacity=".22"/>

  <!-- 01 Build -->
  <g>
    <rect x="24" y="24" width="370" height="252" rx="16" fill="#0e0c0a" stroke="#d4af62" stroke-opacity=".16"/>
    <svg x="24" y="24" width="370" height="2"><rect class="run" width="200" height="2" fill="url(#edge)"/></svg>
    <text x="52" y="66" class="mono" font-size="12" letter-spacing="2.5" fill="#d4af62">01 · SYSTEMS PROGRAMMING</text>
    <text x="52" y="118" class="serif" font-size="46" fill="url(#gold)">Build</text>
    <text class="sans" font-size="15" fill="#b8b0a2"><tspan x="52" y="156">Rust, C/C++ and C# for fast,</tspan><tspan x="52" y="178">reliable systems software.</tspan></text>
    <g class="mono" font-size="13" fill="#7d766b">
      <text x="52" y="236"><tspan fill="#d4af62">fn</tspan> main() { ship(); }<tspan class="blink" fill="#d4af62">▍</tspan></text>
    </g>
    <g transform="translate(330 252)" fill="#d4af62">
      <rect class="bar" x="0" y="-40" width="6" height="40" rx="2" style="transform-origin:0 0;transform-box:fill-box"/>
      <rect class="bar" x="10" y="-40" width="6" height="40" rx="2" opacity=".7" style="transform-origin:0 0;transform-box:fill-box;animation-delay:.4s"/>
      <rect class="bar" x="20" y="-40" width="6" height="40" rx="2" opacity=".45" style="transform-origin:0 0;transform-box:fill-box;animation-delay:.8s"/>
    </g>
  </g>

  <!-- 02 Encrypt -->
  <g>
    <rect x="415" y="24" width="370" height="252" rx="16" fill="#0e0c0a" stroke="#d4af62" stroke-opacity=".16"/>
    <svg x="415" y="24" width="370" height="2"><rect class="run" width="200" height="2" fill="url(#edge)" style="animation-delay:1.1s"/></svg>
    <text x="443" y="66" class="mono" font-size="12" letter-spacing="2.5" fill="#d4af62">02 · CRYPTOGRAPHY</text>
    <text x="443" y="118" class="serif" font-size="46" fill="url(#gold)">Encrypt</text>
    <text class="sans" font-size="15" fill="#b8b0a2"><tspan x="443" y="156">Post-quantum and classical crypto,</tspan><tspan x="443" y="178">combined into end-to-end protocols.</tspan></text>
    <text x="443" y="236" class="mono" font-size="13" fill="#7d766b">ML-KEM · ML-DSA · X25519 · Noise</text>
    <g transform="translate(735 70)">
      <g class="rot"><circle r="18" fill="none" stroke="#d4af62" stroke-opacity=".5" stroke-dasharray="4 6"/><circle cx="18" r="2.5" fill="#d4af62"/></g>
      <path d="M-6 -1v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#d4af62" stroke-width="2"/><rect x="-8" y="-1" width="16" height="12" rx="2.5" fill="#d4af62"/>
    </g>
  </g>

  <!-- 03 Secure -->
  <g>
    <rect x="806" y="24" width="370" height="252" rx="16" fill="#0e0c0a" stroke="#d4af62" stroke-opacity=".16"/>
    <svg x="806" y="24" width="370" height="2"><rect class="run" width="200" height="2" fill="url(#edge)" style="animation-delay:2.2s"/></svg>
    <text x="834" y="66" class="mono" font-size="12" letter-spacing="2.5" fill="#d4af62">03 · SECURITY &amp; NETWORKING</text>
    <text x="834" y="118" class="serif" font-size="46" fill="url(#gold)">Secure</text>
    <text class="sans" font-size="15" fill="#b8b0a2"><tspan x="834" y="156">Windows internals, security research,</tspan><tspan x="834" y="178">custom TCP/UDP stacks.</tspan></text>
    <text x="834" y="236" class="mono" font-size="13" fill="#7d766b">TCP · UDP · peer discovery</text>
    <g transform="translate(1126 70)" fill="none" stroke="#d4af62">
      <path d="M0 -20 L16 -13 V0 C16 11 8 18 0 21 C-8 18 -16 11 -16 0 V-13 Z" stroke-width="1.6"/>
      <path d="M-6 0 l4 5 l9 -10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
