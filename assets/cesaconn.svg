<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CesaConn: post-quantum peer-to-peer device sync</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9c"/><stop offset=".5" stop-color="#d4af62"/><stop offset="1" stop-color="#8f6f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4af62" stop-opacity=".16"/><stop offset="1" stop-color="#d4af62" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
      .dash{stroke-dasharray:6 8;animation:dash 1.4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .halo{animation:halo 2.6s ease-in-out infinite}
      @keyframes halo{0%,100%{opacity:.25}50%{opacity:.9}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="22" fill="#080706"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="21.5" fill="none" stroke="#d4af62" stroke-opacity=".28"/>

  <text x="56" y="70" class="mono" font-size="12" letter-spacing="2.5" fill="#d4af62">● FEATURED PROJECT · CESASEC</text>
  <text x="54" y="138" class="sans" font-size="60" font-weight="700" letter-spacing="-2" fill="url(#gold)">CesaConn</text>
  <text class="sans" font-size="17" fill="#ece6da">
    <tspan x="56" y="182">Cross-platform peer-to-peer device sync: files, clipboard,</tspan>
    <tspan x="56" y="206">notifications and proximity-based locking.</tspan>
    <tspan x="56" y="230">KDE Connect with <tspan class="serif" font-size="21" fill="#d4af62">real</tspan> end-to-end encryption, over the internet.</tspan>
  </text>
  <g class="mono" font-size="12" letter-spacing="1">
    <rect x="56" y="262" width="58" height="28" rx="14" fill="none" stroke="#d4af62" stroke-opacity=".45"/><text x="85" y="281" text-anchor="middle" fill="#d4af62">P2P</text>
    <rect x="124" y="262" width="62" height="28" rx="14" fill="none" stroke="#d4af62" stroke-opacity=".45"/><text x="155" y="281" text-anchor="middle" fill="#d4af62">E2EE</text>
    <rect x="196" y="262" width="118" height="28" rx="14" fill="none" stroke="#d4af62" stroke-opacity=".45"/><text x="255" y="281" text-anchor="middle" fill="#d4af62">Post-quantum</text>
    <rect x="324" y="262" width="196" height="28" rx="14" fill="none" stroke="#d4af62" stroke-opacity=".45"/><text x="422" y="281" text-anchor="middle" fill="#d4af62">AGPL-3.0 + commercial</text>
  </g>
  <text x="56" y="324" class="mono" font-size="12" fill="#7d766b">Pairing: CPQHA · SPAKE2 + X25519/ML-KEM-1024 + Noise XXpsk2 · SAS verification</text>

  <!-- two devices linked by an encrypted tunnel -->
  <g transform="translate(0 0)">
    <path d="M820 180 H1040" stroke="#d4af62" stroke-opacity=".18" stroke-width="14" stroke-linecap="round"/>
    <path class="dash" d="M820 180 H1040" stroke="#d4af62" stroke-width="2" fill="none"/>
    <circle r="5" fill="#f3dc9c"><animateMotion dur="2.4s" repeatCount="indefinite" path="M820 180 H1040" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="spline" keySplines=".5 0 .5 1;.5 0 .5 1"/></circle>

    <!-- laptop -->
    <g transform="translate(740 180)">
      <rect x="-56" y="-44" width="112" height="72" rx="8" fill="#0e0c0a" stroke="url(#gold)" stroke-width="1.6"/>
      <rect x="-46" y="-34" width="92" height="52" rx="3" fill="#15120e"/>
      <path d="M-70 34 H70 L60 44 H-60 Z" fill="url(#gold)" opacity=".85"/>
      <text y="0" text-anchor="middle" class="mono" font-size="10" fill="#d4af62">a7f3·91c2</text>
    </g>
    <!-- phone -->
    <g transform="translate(1090 180)">
      <rect x="-30" y="-56" width="60" height="112" rx="12" fill="#0e0c0a" stroke="url(#gold)" stroke-width="1.6"/>
      <rect x="-22" y="-44" width="44" height="84" rx="4" fill="#15120e"/>
      <rect x="-8" y="-51" width="16" height="3" rx="1.5" fill="#d4af62" opacity=".6"/>
      <text y="2" text-anchor="middle" class="mono" font-size="9" fill="#d4af62">a7f3·91c2</text>
    </g>
    <!-- lock in the middle -->
    <g transform="translate(930 180)">
      <circle r="34" fill="#080706" stroke="#d4af62" stroke-opacity=".5"/>
      <circle r="44" fill="none" stroke="#d4af62" stroke-width="6" stroke-opacity=".12" class="halo"/>
      <path d="M-9 -2v-7a9 9 0 0 1 18 0v7" fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>
      <rect x="-14" y="-3" width="28" height="22" rx="4" fill="url(#gold)"/>
    </g>
    <text x="930" y="268" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#7d766b">SAS MATCH · CHANNEL SEALED</text>
  </g>
</svg>
