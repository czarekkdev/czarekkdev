<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Czarek Judka · sys.krnl</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc9c"/>
      <stop offset="0.45" stop-color="#d4af62"/>
      <stop offset="1" stop-color="#8f6f2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d4af62" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af62" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d4af62" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
    <mask id="nameMask">
      <text x="72" y="214" class="name" fill="#fff">Czarek Judka</text>
    </mask>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic}
      .name{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:92px;font-weight:700;letter-spacing:-3.5px}
      .sweep{animation:sweep 5s ease-in-out 1.4s infinite}
      @keyframes sweep{0%{transform:translateX(-420px)}55%,100%{transform:translateX(900px)}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-10px)}to{transform:translateY(430px)}}
      .spin{transform-origin:900px 210px;animation:spin 40s linear infinite}
      .spinr{transform-origin:900px 210px;animation:spin 28s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .bit{animation:bit 3s linear infinite}
      @keyframes bit{0%{opacity:0}20%{opacity:.9}80%{opacity:.9}100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#080706"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>

    <!-- lock / orbit visual -->
    <g opacity="0.9">
      <g class="spin" fill="none" stroke="#d4af62">
        <circle cx="900" cy="210" r="150" stroke-opacity="0.18" stroke-dasharray="2 10"/>
        <circle cx="1050" cy="210" r="5" fill="#d4af62" stroke="none"/>
        <circle cx="750" cy="210" r="3" fill="#d4af62" fill-opacity=".6" stroke="none"/>
      </g>
      <g class="spinr" fill="none" stroke="#d4af62">
        <circle cx="900" cy="210" r="112" stroke-opacity="0.3" stroke-dasharray="60 16 4 16"/>
        <circle cx="900" cy="98" r="4" fill="#f3dc9c" stroke="none"/>
      </g>
      <circle cx="900" cy="210" r="78" fill="#0e0c0a" stroke="url(#gold)" stroke-width="1.5"/>
      <!-- padlock -->
      <path d="M876 202v-16a24 24 0 0 1 48 0v16" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
      <rect x="866" y="200" width="68" height="52" rx="10" fill="url(#gold)"/>
      <circle cx="900" cy="222" r="7" fill="#080706"/>
      <rect x="897" y="224" width="6" height="16" rx="3" fill="#080706"/>
      <circle cx="900" cy="210" r="78" fill="none" stroke="#d4af62" stroke-width="10" stroke-opacity=".08" class="pulse"/>
    </g>

    <!-- hex stream -->
    <g class="mono" font-size="12" fill="#d4af62" fill-opacity=".38">
      <text x="1040" y="70" class="bit">ML-KEM-1024</text>
      <text x="1092" y="112" class="bit" style="animation-delay:.8s">X25519</text>
      <text x="1080" y="320" class="bit" style="animation-delay:1.6s">ML-DSA-87</text>
      <text x="1100" y="362" class="bit" style="animation-delay:2.2s">Noise</text>
      <text x="690" y="70" class="bit" style="animation-delay:1.2s">SPAKE2</text>
      <text x="676" y="364" class="bit" style="animation-delay:2.6s">AES-256</text>
    </g>

    <!-- text block -->
    <g><text x="74" y="104" class="mono" font-size="15" letter-spacing="3" fill="#d4af62">● SYS.KRNL</text></g>
    <g>
      <text x="72" y="214" class="name" fill="url(#gold)">Czarek Judka</text>
      <g mask="url(#nameMask)"><rect class="sweep" x="0" y="120" width="160" height="120" fill="url(#shine)" transform="skewX(-20)"/></g>
    </g>
    <g>
      <text x="75" y="266" class="sans" font-size="26" fill="#ece6da">Rust, cryptography &amp; <tspan class="serif" font-size="31" fill="#d4af62">privacy-first</tspan> software.</text>
    </g>
    <g>
      <clipPath id="typeClip"><rect x="75" y="290" width="470" height="30"><animate attributeName="width" from="0" to="470" dur="2.6s" begin="0.4s" fill="freeze" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;470"/></rect></clipPath>
      <text x="75" y="310" class="mono" font-size="15" fill="#9c9488" clip-path="url(#typeClip)">$ founder @ CesaSec · 42 Heilbronn · Poland</text>
    </g>
    <g>
      <rect x="75" y="340" width="190" height="34" rx="17" fill="none" stroke="#d4af62" stroke-opacity=".5"/>
      <text x="170" y="362" text-anchor="middle" class="mono" font-size="13" letter-spacing="1.5" fill="#d4af62">czarekk.dev ↗</text>
    </g>

    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#d4af62" fill-opacity=".07"/>
    <rect x="0.5" y="0.5" width="1199" height="419" rx="21.5" fill="none" stroke="#d4af62" stroke-opacity=".28"/>
  </g>
</svg>
